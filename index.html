<!DOCTYPE html>
<html lang="mn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Удирдлага</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body { 
            background: #0a0a0a; 
            color: #0f0; 
            font-family: 'Courier New', monospace; 
            touch-action: none; 
            overflow: hidden; 
            user-select: none;
            margin: 0;
            display: flex;
            flex-direction: column;
            height: 100vh;
        }
        .panel { background: #111; border: 1px solid #333; border-radius: 12px; padding: 15px; }
        .joystick-view { 
            width: 180px; 
            height: 180px; 
            border: 2px solid #222; 
            border-radius: 50%; 
            position: relative; 
            background: radial-gradient(circle, #1a1a1a 0%, #000 100%); 
            box-shadow: inset 0 0 20px rgba(0,255,0,0.1);
        }
        .stick { 
            width: 50px; 
            height: 50px; 
            background: #0f0; 
            border-radius: 50%; 
            position: absolute; 
            top: 50%; 
            left: 50%; 
            transform: translate(-50%, -50%); 
            box-shadow: 0 0 25px #0f0; 
            z-index: 10;
            pointer-events: none;
        }
        .active-key { background: #0f0 !important; color: #000 !important; box-shadow: 0 0 15px #0f0; }
        .status-dot { width: 8px; height: 8px; border-radius: 50%; display: inline-block; margin-right: 5px; }
        
        .motor-indicator {
            width: 100%;
            height: 12px;
            background: #222;
            border-radius: 6px;
            position: relative;
            overflow: hidden;
            border: 1px solid #444;
        }
        .motor-fill {
            height: 100%;
            background: #0f0;
            width: 0%;
            transition: width 0.05s linear;
        }
        .fwd { background: #0f0; box-shadow: 0 0 10px #0f0; }
        .rev { background: #f00; box-shadow: 0 0 10px #f00; }
    </style>
</head>
<body class="p-4 md:p-6 gap-4">

    <!-- Header -->
    <div class="panel flex justify-between items-center py-3">
        <div>
            <h1 class="text-xl font-bold tracking-tighter text-white uppercase">Nexus Vector <span class="text-green-500 text-xs ml-2">V3.0</span></h1>
            <p class="text-[10px] text-gray-500 uppercase tracking-widest">
                <span id="status-dot" class="status-dot bg-red-600"></span>
                Status: <span id="link-text">DISCONNECTED</span> | Dual-Channel Vector Mixing
            </p>
        </div>
        <div class="relative">
            <input id="ip-input" type="password" placeholder="Bridge IP" 
                   class="bg-black border border-gray-700 px-3 py-1 rounded text-sm text-center text-white focus:border-green-500 outline-none w-36 md:w-48">
        </div>
    </div>

    <div class="flex flex-1 gap-4 overflow-hidden flex-col md:flex-row">
        <!-- Main Control Area -->
        <div class="panel flex-[3] flex flex-col items-center justify-around">
            <div class="text-center">
                <p id="dir-text" class="text-3xl font-black text-white tracking-[0.2em] italic uppercase">STOPPED</p>
                <p id="input-mode" class="text-[10px] text-green-500 mt-2 tracking-widest font-bold">IDLE</p>
            </div>

            <div class="joystick-view" id="joy-area">
                <div id="visual-stick" class="stick"></div>
                <div class="absolute top-1/2 left-0 w-full h-[1px] bg-gray-800"></div>
                <div class="absolute left-1/2 top-0 h-full w-[1px] bg-gray-800"></div>
            </div>

            <div class="flex gap-20">
                <div class="text-center">
                    <p class="text-[10px] text-gray-500 mb-1">LEFT CHANNEL</p>
                    <p id="val-l" class="text-4xl font-bold text-white">0</p>
                </div>
                <div class="text-center">
                    <p class="text-[10px] text-gray-500 mb-1">RIGHT CHANNEL</p>
                    <p id="val-r" class="text-4xl font-bold text-white">0</p>
                </div>
            </div>
        </div>

        <!-- Feedback & Settings -->
        <div class="flex flex-col gap-4 w-full md:w-80">
            <div class="panel flex-1">
                <h3 class="text-[10px] text-gray-400 font-bold mb-6 uppercase border-b border-gray-800 pb-2">Real-time Telemetry</h3>
                
                <div class="space-y-6">
                    <div class="space-y-2">
                        <div class="flex justify-between text-[10px]">
                            <span>LEFT MOTORS (M1, M2)</span>
                            <span id="perc-l">0%</span>
                        </div>
                        <div class="motor-indicator"><div id="fill-l" class="motor-fill"></div></div>
                    </div>

                    <div class="space-y-2">
                        <div class="flex justify-between text-[10px]">
                            <span>RIGHT MOTORS (M3, M4)</span>
                            <span id="perc-r">0%</span>
                        </div>
                        <div class="motor-indicator"><div id="fill-r" class="motor-fill"></div></div>
                    </div>
                </div>

                <div class="mt-10 grid grid-cols-3 gap-2 opacity-50">
                    <div></div><div id="key-w" class="p-3 bg-gray-900 border border-gray-700 rounded text-center text-xs">W</div><div></div>
                    <div id="key-a" class="p-3 bg-gray-900 border border-gray-700 rounded text-center text-xs">A</div>
                    <div id="key-s" class="p-3 bg-gray-900 border border-gray-700 rounded text-center text-xs">S</div>
                    <div id="key-d" class="p-3 bg-gray-900 border border-gray-700 rounded text-center text-xs">D</div>
                </div>
            </div>
        </div>
    </div>

    <script>
        const ipInput = document.getElementById('ip-input');
        const visualStick = document.getElementById('visual-stick');
        const joyArea = document.getElementById('joy-area');
        
        if(localStorage.getItem('last_ip')) ipInput.value = localStorage.getItem('last_ip');

        let bridgeActive = false;
        let lastPacket = "";
        const DEADZONE = 0.1;
        const MIN_PWM = 45; 
        const MAX_PWM = 255;
        
        let touchData = { active: false, x: 0, y: 0 };
        let keyboardStack = [];

        // --- Vector Mixing Engine ---
        function mixMotors(y, x) {
            // Magnitude (how far stick is pushed)
            let magnitude = Math.sqrt(x*x + y*y);
            if (magnitude < DEADZONE) return { L: 0, R: 0, rawX: 0, rawY: 0 };
            if (magnitude > 1) magnitude = 1;

            // Simple Differential Drive Mixing
            // Y is forward/back, X is left/right rotation
            let left = y + x;
            let right = y - x;

            // Normalize so we don't exceed 1.0
            const maxInput = Math.max(Math.abs(left), Math.abs(right));
            if (maxInput > 1) {
                left /= maxInput;
                right /= maxInput;
            }

            // Apply magnitude scaling (for pressure sensitivity)
            left *= magnitude;
            right *= magnitude;

            const toPWM = (val) => {
                if (Math.abs(val) < 0.02) return 0;
                let pwm = MIN_PWM + (Math.abs(val) * (MAX_PWM - MIN_PWM));
                return Math.round(pwm * (val > 0 ? 1 : -1));
            };

            return { L: toPWM(left), R: toPWM(right), rawX: x, rawY: y };
        }

        // --- Input Handlers ---
        joyArea.addEventListener('touchstart', (e) => { touchData.active = true; handleTouch(e); });
        window.addEventListener('touchmove', (e) => { if(touchData.active) handleTouch(e); });
        window.addEventListener('touchend', () => { touchData.active = false; touchData.x = 0; touchData.y = 0; });

        function handleTouch(e) {
            const rect = joyArea.getBoundingClientRect();
            const centerX = rect.left + rect.width / 2;
            const centerY = rect.top + rect.height / 2;
            const touch = e.touches[0];
            
            let dx = (touch.clientX - centerX) / (rect.width / 2);
            let dy = (centerY - touch.clientY) / (rect.height / 2);
            
            touchData.x = Math.max(-1, Math.min(1, dx));
            touchData.y = Math.max(-1, Math.min(1, dy));
        }

        function getDirectionName(y, x) {
            if (Math.abs(x) < DEADZONE && Math.abs(y) < DEADZONE) return "STOPPED";
            const angle = Math.atan2(y, x) * 180 / Math.PI;
            if (angle > 60 && angle < 120) return "FORWARD";
            if (angle < -60 && angle > -120) return "REVERSE";
            if (angle >= -30 && angle <= 30) return "ROTATE RIGHT";
            if (angle >= 150 || angle <= -150) return "ROTATE LEFT";
            return "VECTORING";
        }

        function loop() {
            let motorData = { L: 0, R: 0, rawX: 0, rawY: 0 };
            let mode = "IDLE";

            if (touchData.active) {
                motorData = mixMotors(touchData.y, touchData.x);
                mode = "JOYSTICK";
            } else if (keyboardStack.length > 0) {
                const key = keyboardStack[keyboardStack.length - 1];
                if (key === 'w') motorData = mixMotors(1, 0);
                if (key === 's') motorData = mixMotors(-1, 0);
                if (key === 'a') motorData = mixMotors(0, -1);
                if (key === 'd') motorData = mixMotors(0, 1);
                mode = "KEYBOARD";
            }

            // UI Updates
            document.getElementById('dir-text').innerText = getDirectionName(motorData.rawY, motorData.rawX);
            document.getElementById('val-l').innerText = motorData.L;
            document.getElementById('val-r').innerText = motorData.R;
            document.getElementById('input-mode').innerText = mode;
            
            visualStick.style.left = (50 + (motorData.rawX * 40)) + "%";
            visualStick.style.top = (50 - (motorData.rawY * 40)) + "%";

            // Bar Telemetry
            const updateBar = (side, val) => {
                const fill = document.getElementById('fill-' + side);
                const perc = document.getElementById('perc-' + side);
                const absVal = Math.abs(val);
                fill.style.width = (absVal / 255 * 100) + "%";
                fill.className = `motor-fill ${val >= 0 ? 'fwd' : 'rev'}`;
                perc.innerText = Math.round(absVal / 255 * 100) + "%";
            };
            updateBar('l', motorData.L);
            updateBar('r', motorData.R);

            transmit(motorData);
            requestAnimationFrame(loop);
        }

        function transmit(data) {
            const packet = `L:${data.L},R:${data.R}`;
            if (packet === lastPacket) return;
            lastPacket = packet;

            const ip = ipInput.value.trim();
            if (!ip) return;
            localStorage.setItem('last_ip', ip);

            fetch(`http://${ip}:5000/control`, {
                method: 'POST',
                headers: { 'Content-Type': 'text/plain' },
                body: JSON.stringify({ throttle: packet }),
                mode: 'no-cors'
            }).catch(()=>{});
        }

        // Bridge Ping
        setInterval(async () => {
            const ip = ipInput.value.trim();
            if(!ip) return;
            try {
                const ac = new AbortController();
                setTimeout(() => ac.abort(), 800);
                await fetch(`http://${ip}:5000/`, { mode: 'no-cors', signal: ac.signal });
                bridgeActive = true;
                document.getElementById('status-dot').className = "status-dot bg-green-500";
                document.getElementById('link-text').innerText = "CONNECTED";
            } catch(e) {
                bridgeActive = false;
                document.getElementById('status-dot').className = "status-dot bg-red-600";
                document.getElementById('link-text').innerText = "OFFLINE";
            }
        }, 2000);

        window.addEventListener('keydown', (e) => {
            const key = e.key.toLowerCase();
            if (['w','a','s','d'].includes(key) && !keyboardStack.includes(key)) {
                keyboardStack.push(key);
                document.getElementById('key-'+key)?.classList.add('active-key');
            }
        });
        window.addEventListener('keyup', (e) => {
            const key = e.key.toLowerCase();
            keyboardStack = keyboardStack.filter(k => k !== key);
            document.getElementById('key-'+key)?.classList.remove('active-key');
        });

        loop();
    </script>
</body>
</html>
