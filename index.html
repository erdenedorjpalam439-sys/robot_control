<!DOCTYPE html>
<html lang="mn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Удирдлага</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body { 
            background: #0a0a0a; 
            color: #0f0; 
            font-family: 'Courier New', monospace; 
            touch-action: none; 
            overflow: hidden; 
            user-select: none;
            margin: 0;
            display: flex;
            flex-direction: column;
            height: 100vh;
        }
        .panel { background: #111; border: 1px solid #333; border-radius: 12px; padding: 15px; }
        .joystick-view { 
            width: 160px; 
            height: 160px; 
            border: 2px solid #222; 
            border-radius: 50%; 
            position: relative; 
            background: radial-gradient(circle, #1a1a1a 0%, #000 100%); 
            box-shadow: inset 0 0 20px rgba(0,255,0,0.1);
        }
        .stick { 
            width: 44px; 
            height: 44px; 
            background: #0f0; 
            border-radius: 50%; 
            position: absolute; 
            top: 50%; 
            left: 50%; 
            transform: translate(-50%, -50%); 
            box-shadow: 0 0 20px #0f0; 
            z-index: 10;
            pointer-events: none;
        }
        .active-key { background: #0f0 !important; color: #000 !important; box-shadow: 0 0 15px #0f0; }
        .status-dot { width: 8px; height: 8px; border-radius: 50%; display: inline-block; margin-right: 5px; }
        
        .motor-indicator {
            width: 60px;
            height: 30px;
            background: #222;
            border-radius: 4px;
            position: relative;
            overflow: hidden;
            border: 1px solid #444;
        }
        .motor-fill {
            height: 100%;
            background: #0f0;
            width: 0%;
            transition: width 0.1s linear;
        }
        .fwd { background: #0f0; }
        .rev { background: #f00; }
        
        input[type="password"] {
            letter-spacing: 2px;
        }
    </style>
</head>
<body class="p-4 md:p-6 gap-4">

    <!-- Header -->
    <div class="panel flex justify-between items-center py-3">
        <div>
            <h1 class="text-xl font-bold tracking-tighter text-white">УДИРДЛАГА <span class="text-green-500 text-xs ml-2">V2.3</span></h1>
            <p class="text-[10px] text-gray-500 uppercase tracking-widest">
                <span id="status-dot" class="status-dot bg-red-600"></span>
                Холболт: <span id="link-text">Салсан</span> | PWM суурь: 50
            </p>
        </div>
        <div class="flex gap-4 items-center">
            <div class="relative">
                <input id="ip-input" type="password" placeholder="IP хаяг" autocomplete="off"
                       class="bg-black border border-gray-700 px-3 py-1 rounded text-sm text-center text-white focus:border-green-500 outline-none w-36 md:w-48">
                <button id="toggle-ip-btn" class="absolute right-2 top-1.5 text-[10px] text-gray-500">👁</button>
            </div>
        </div>
    </div>

    <div class="flex flex-1 gap-4 overflow-hidden flex-col md:flex-row">
        <!-- Center Console -->
        <div class="panel flex-[2] flex flex-col items-center justify-around min-h-[300px]">
            <div class="text-center">
                <p class="text-[10px] text-gray-500 uppercase font-bold mb-1">Хөдөлгөөний чиглэл</p>
                <h2 id="dir-text" class="text-2xl font-black text-white tracking-widest italic">ЗОГСОЛТ</h2>
            </div>

            <div class="joystick-view" id="joy-area">
                <div id="visual-stick" class="stick"></div>
                <div class="absolute top-1/2 left-0 w-full h-[1px] bg-gray-800"></div>
                <div class="absolute left-1/2 top-0 h-full w-[1px] bg-gray-800"></div>
            </div>

            <div class="grid grid-cols-2 gap-12 text-center">
                <div>
                    <p class="text-[9px] text-gray-500 uppercase font-bold">ЗҮҮН</p>
                    <p id="val-l" class="text-3xl font-bold text-white leading-none">0</p>
                </div>
                <div>
                    <p class="text-[9px] text-gray-500 uppercase font-bold">БАРУУН</p>
                    <p id="val-r" class="text-3xl font-bold text-white leading-none">0</p>
                </div>
            </div>
        </div>

        <!-- Side Telemetry -->
        <div class="flex flex-col gap-4 w-full md:w-80">
            <div class="panel flex-1">
                <h3 class="text-[10px] text-gray-400 font-bold mb-4 border-b border-gray-800 pb-1 uppercase">Моторын төлөв (4WD)</h3>
                <div class="grid grid-cols-2 gap-y-6 gap-x-4">
                    <div class="space-y-1">
                        <p class="text-[8px] text-gray-500 font-bold">M1 (УРД-ЗҮҮН)</p>
                        <div class="motor-indicator"><div id="m1-fill" class="motor-fill"></div></div>
                        <p id="m1-label" class="text-[9px] text-gray-400">ХҮЛЭЭЖ БАЙНА</p>
                    </div>
                    <div class="space-y-1">
                        <p class="text-[8px] text-gray-500 text-right font-bold">M3 (УРД-БАРУУН)</p>
                        <div class="motor-indicator ml-auto"><div id="m3-fill" class="motor-fill"></div></div>
                        <p id="m3-label" class="text-[9px] text-gray-400 text-right">ХҮЛЭЭЖ БАЙНА</p>
                    </div>
                    <div class="space-y-1">
                        <p class="text-[8px] text-gray-500 font-bold">M2 (АРД-ЗҮҮН)</p>
                        <div class="motor-indicator"><div id="m2-fill" class="motor-fill"></div></div>
                        <p id="m2-label" class="text-[9px] text-gray-400">ХҮЛЭЭЖ БАЙНА</p>
                    </div>
                    <div class="space-y-1">
                        <p class="text-[8px] text-gray-500 text-right font-bold">M4 (АРД-БАРУУН)</p>
                        <div class="motor-indicator ml-auto"><div id="m4-fill" class="motor-fill"></div></div>
                        <p id="m4-label" class="text-[9px] text-gray-400 text-right">ХҮЛЭЭЖ БАЙНА</p>
                    </div>
                </div>
            </div>

            <div class="panel">
                <h3 class="text-[10px] text-gray-400 font-bold mb-3 uppercase">Оролтын төрөл</h3>
                <div class="flex justify-between items-center mb-4">
                    <span id="input-mode" class="px-3 py-1 bg-green-950 text-green-400 border border-green-800 rounded text-[10px] font-bold uppercase">ЗОГСОЛТ</span>
                    <span class="text-[10px] text-gray-600">WASD: ИДЭВХТЭЙ</span>
                </div>
                <div class="grid grid-cols-3 gap-1 max-w-[120px] mx-auto opacity-40">
                    <div></div><div id="key-w" class="p-2 bg-gray-900 border border-gray-700 rounded text-center text-xs">W</div><div></div>
                    <div id="key-a" class="p-2 bg-gray-900 border border-gray-700 rounded text-center text-xs">A</div>
                    <div id="key-s" class="p-2 bg-gray-900 border border-gray-700 rounded text-center text-xs">S</div>
                    <div id="key-d" class="p-2 bg-gray-900 border border-gray-700 rounded text-center text-xs">D</div>
                </div>
            </div>
        </div>
    </div>

    <script>
        const ipInput = document.getElementById('ip-input');
        const visualStick = document.getElementById('visual-stick');
        const statusDot = document.getElementById('status-dot');
        const linkText = document.getElementById('link-text');
        const dirText = document.getElementById('dir-text');
        const toggleBtn = document.getElementById('toggle-ip-btn');
        
        // Initial setup
        if(localStorage.getItem('last_ip')) ipInput.value = localStorage.getItem('last_ip');

        let bridgeActive = false;
        let lastPacket = "";
        const DEADZONE = 0.12;
        const MIN_PWM = 50; 
        const MAX_PWM = 255;
        let keyboardStack = [];
        let gamepadIndex = null;

        // Toggle IP Visibility
        toggleBtn.addEventListener('click', () => {
            ipInput.type = ipInput.type === "password" ? "text" : "password";
        });

        // Bridge Health Check
        async function pingBridge() {
            const ip = ipInput.value.trim();
            if(!ip) return;
            localStorage.setItem('last_ip', ip);
            try {
                // Ping the root endpoint
                const controller = new AbortController();
                const timeoutId = setTimeout(() => controller.abort(), 1000);
                await fetch(`http://${ip}:5000/`, { mode: 'no-cors', signal: controller.signal });
                bridgeActive = true;
                statusDot.className = "status-dot bg-green-500";
                linkText.innerText = "Холбогдсон";
            } catch (e) { 
                bridgeActive = false;
                statusDot.className = "status-dot bg-red-600";
                linkText.innerText = "Салсан";
            }
        }
        setInterval(pingBridge, 3000);

        window.addEventListener("gamepadconnected", (e) => { 
            gamepadIndex = e.gamepad.index; 
            console.log("Gamepad Linked");
        });

        function getDirectionName(y, x) {
            if (Math.abs(x) < DEADZONE && Math.abs(y) < DEADZONE) return "ЗОГСОЛТ";
            const angle = Math.atan2(y, x) * 180 / Math.PI;
            if (angle > 67.5 && angle <= 112.5) return "УРАГШАА";
            if (angle > 112.5 && angle <= 157.5) return "УРАГШ-ЗҮҮН";
            if (angle > 22.5 && angle <= 67.5) return "УРАГШ-БАРУУН";
            if (angle > -22.5 && angle <= 22.5) return "БАРУУН ЭРГЭЛТ";
            if (angle > 157.5 || angle <= -157.5) return "ЗҮҮН ЭРГЭЛТ";
            if (angle < -67.5 && angle >= -112.5) return "ХОЙШОО";
            if (angle < -112.5 && angle >= -157.5) return "ХОЙШ-ЗҮҮН";
            if (angle < -22.5 && angle >= -67.5) return "ХОЙШ-БАРУУН";
            return "ХӨДӨЛГӨӨН";
        }

        function calculateMotors(y, x) {
            let left = y + x;
            let right = y - x;
            left = Math.max(-1, Math.min(1, left));
            right = Math.max(-1, Math.min(1, right));
            const process = (val) => {
                const absVal = Math.abs(val);
                if (absVal < 0.05) return 0;
                let pwm = MIN_PWM + (absVal * (MAX_PWM - MIN_PWM));
                return Math.round(pwm * (val > 0 ? 1 : -1));
            };
            return { L: process(left), R: process(right), rawX: x, rawY: y };
        }

        function updateMotorUI(l, r) {
            document.getElementById('val-l').innerText = l;
            document.getElementById('val-r').innerText = r;
            const updateMotor = (id, val) => {
                const fill = document.getElementById(id + '-fill');
                const label = document.getElementById(id + '-label');
                const absVal = Math.abs(val);
                fill.style.width = ((absVal / 255) * 100) + "%";
                fill.className = `motor-fill ${val >= 0 ? 'fwd' : 'rev'}`;
                label.innerText = val === 0 ? "ЗОГСОЛТ" : `${val > 0 ? 'УРАГШ' : 'ХОЙШ'} @ ${absVal}`;
                label.className = `text-[9px] ${val > 0 ? 'text-green-400' : (val < 0 ? 'text-red-400' : 'text-gray-400')}`;
            };
            updateMotor('m1', l); updateMotor('m2', l);
            updateMotor('m3', r); updateMotor('m4', r);
        }

        function update() {
            let motorData = { L: 0, R: 0, rawX: 0, rawY: 0 };
            let mode = "ЗОГСОЛТ";
            
            const gp = gamepadIndex !== null ? navigator.getGamepads()[gamepadIndex] : null;
            if (gp && (Math.abs(gp.axes[0]) > DEADZONE || Math.abs(gp.axes[1]) > DEADZONE)) {
                motorData = calculateMotors(-gp.axes[1], gp.axes[0]);
                mode = "ГЕЙМПАД";
            } else if (keyboardStack.length > 0) {
                const key = keyboardStack[keyboardStack.length - 1];
                if (key === 'w') motorData = calculateMotors(1, 0);
                if (key === 's') motorData = calculateMotors(-1, 0);
                if (key === 'a') motorData = calculateMotors(0, -1);
                if (key === 'd') motorData = calculateMotors(0, 1);
                mode = "ГАР";
            }

            dirText.innerText = getDirectionName(motorData.rawY, motorData.rawX);
            updateMotorUI(motorData.L, motorData.R);
            transmit(motorData, mode);
            requestAnimationFrame(update);
        }

        function transmit(data, mode) {
            const packet = `L:${data.L},R:${data.R}`;
            document.getElementById('input-mode').innerText = mode;
            visualStick.style.left = (50 + (data.rawX * 40)) + "%";
            visualStick.style.top = (50 - (data.rawY * 40)) + "%";
            
            if (packet === lastPacket) return;
            lastPacket = packet;

            if (!bridgeActive) return;

            const ip = ipInput.value.trim();
            fetch(`http://${ip}:5000/control`, {
                method: 'POST',
                headers: { 'Content-Type': 'text/plain' },
                body: JSON.stringify({ throttle: packet }),
                mode: 'no-cors'
            }).catch(()=>{});
        }

        window.addEventListener('keydown', (e) => {
            const key = e.key.toLowerCase();
            if (['w','a','s','d'].includes(key) && !keyboardStack.includes(key)) {
                keyboardStack.push(key);
                document.getElementById('key-'+key)?.classList.add('active-key');
            }
        });
        window.addEventListener('keyup', (e) => {
            const key = e.key.toLowerCase();
            keyboardStack = keyboardStack.filter(k => k !== key);
            document.getElementById('key-'+key)?.classList.remove('active-key');
        });

        update();
    </script>
</body>
</html>
