<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>RC Pro - Direct Link</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body { background: #0a0a0a; color: #fff; font-family: monospace; touch-action: none; overflow: hidden; }
        .well { background: #000; border: 2px solid #333; position: relative; display: flex; justify-content: center; align-items: center; border-radius: 40px; }
        .well-v { width: 90px; height: 350px; }
        .handle { width: 84px; height: 84px; background: #444; border-radius: 50%; border: 2px solid #666; position: absolute; box-shadow: 0 5px 15px #000; }
        .lcd { background: #051005; border: 1px solid #1a1a1a; padding: 10px; color: #0f0; font-size: 11px; height: 100px; overflow-y: auto; border-radius: 5px; }
    </style>
</head>
<body class="p-4 flex flex-col gap-4">

    <div class="bg-zinc-900 p-3 rounded-lg border border-zinc-800 flex flex-col gap-2">
        <div class="flex justify-between items-center">
            <span class="text-[10px] text-zinc-500 font-bold">BRIDGE IP:</span>
            <input id="ip-input" type="text" inputmode="decimal" class="bg-black border border-zinc-700 px-2 py-2 text-white text-sm w-44 rounded" placeholder="192.168.x.x">
        </div>
        <button onclick="testConn()" class="bg-blue-600 text-[11px] font-bold py-2 rounded active:bg-blue-400">SYNC CONNECTION</button>
    </div>

    <div class="flex-1 flex justify-center items-center">
        <div class="flex flex-col items-center gap-2">
            <div class="well well-v" id="th-well">
                <div class="handle" id="th-handle"></div>
            </div>
            <span class="text-[10px] text-zinc-600 font-bold">THROTTLE</span>
        </div>
    </div>

    <div class="lcd" id="log-window">
        <div id="log-content">
            <div>[ SYSTEM STANDBY ]</div>
            <div>Browser Link: OK</div>
        </div>
    </div>

    <script>
        const logContent = document.getElementById('log-content');
        const thHandle = document.getElementById('th-handle');
        const thWell = document.getElementById('th-well');
        const ipInput = document.getElementById('ip-input');
        
        if(localStorage.getItem('last_ip')) ipInput.value = localStorage.getItem('last_ip');

        let throttleValue = 0;
        let lastSentValue = null;
        let isReady = false;

        function log(msg) {
            const div = document.createElement('div');
            div.innerText = `> ${msg}`;
            logContent.appendChild(div);
            document.getElementById('log-window').scrollTop = 9999;
        }

        async function testConn() {
            const ip = ipInput.value.trim();
            localStorage.setItem('last_ip', ip);
            log(`Pinging ${ip}...`);
            try {
                // Simplified fetch to bypass CORS preflight
                await fetch(`http://${ip}:5000/`, { mode: 'no-cors' });
                log("SYNC SUCCESS!");
                isReady = true;
            } catch (e) {
                log("SYNC FAILED. Check Firewall.");
            }
        }

        // Loop runs at 10Hz (100ms) for stability
        setInterval(async () => {
            if (!isReady || throttleValue === lastSentValue) return;
            
            const ip = ipInput.value.trim();
            lastSentValue = throttleValue;

            try {
                // We use text/plain to avoid "Preflight" requests that crash mobile browsers
                await fetch(`http://${ip}:5000/control`, {
                    method: 'POST',
                    mode: 'cors',
                    headers: { 'Content-Type': 'text/plain' },
                    body: JSON.stringify({ throttle: throttleValue, steering: 0 })
                });
            } catch (e) {
                // Quiet fail
            }
        }, 100);

        function init() {
            let dragging = false;
            let rect = null;

            const move = (e) => {
                if (!dragging) return;
                const touch = e.touches ? e.touches[0] : e;
                if (!rect) rect = thWell.getBoundingClientRect();
                
                const limit = rect.height / 2 - 45;
                let pos = touch.clientY - (rect.top + rect.height / 2);
                pos = Math.max(-limit, Math.min(limit, pos));
                
                thHandle.style.transform = `translateY(${pos}px)`;
                
                let raw = Math.round((pos / limit) * -255);
                if (Math.abs(raw) < 20) throttleValue = 0;
                else throttleValue = raw;
            };

            thHandle.addEventListener('touchstart', (e) => {
                e.preventDefault();
                rect = thWell.getBoundingClientRect();
                dragging = true;
            });

            window.addEventListener('touchmove', move, { passive: false });
            
            window.addEventListener('touchend', () => {
                dragging = false;
                thHandle.style.transition = "transform 0.2s ease-out";
                thHandle.style.transform = "translateY(0)";
                throttleValue = 0;
                setTimeout(() => thHandle.style.transition = "", 200);
            });
        }
        init();
    </script>
</body>
</html>
