<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>RC Pro - 4WD Nexus</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body { background: #0a0a0a; color: #0f0; font-family: 'Courier New', monospace; touch-action: none; overflow: hidden; }
        .panel { background: #111; border: 1px solid #333; border-radius: 12px; padding: 15px; }
        .joystick-view { width: 150px; height: 150px; border: 2px solid #222; border-radius: 50%; position: relative; background: radial-gradient(circle, #1a1a1a 0%, #000 100%); }
        .stick { width: 40px; height: 40px; background: #0f0; border-radius: 50%; position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); box-shadow: 0 0 15px #0f0; }
        .motor-indicator { width: 40px; height: 10px; background: #222; border-radius: 5px; overflow: hidden; }
        .motor-fill { height: 100%; width: 0%; background: #0f0; transition: width 0.1s; }
        .active-key { background: #0f0 !important; color: #000 !important; }
    </style>
</head>
<body class="p-6 flex flex-col gap-6 h-screen">

    <!-- Header & Config -->
    <div class="panel flex justify-between items-center">
        <div>
            <h1 class="text-xl font-bold tracking-tighter">NEXUS COMMAND v4.0</h1>
            <p class="text-[10px] text-gray-500">4WD SKID-STEER PROPORTIONAL SYSTEM</p>
        </div>
        <div class="flex gap-4 items-center">
            <input id="ip-input" type="text" placeholder="192.168.x.x" class="bg-black border border-gray-700 px-3 py-1 rounded text-sm text-center">
            <div id="connection-status" class="w-3 h-3 rounded-full bg-red-600 shadow-[0_0_10px_red]"></div>
        </div>
    </div>

    <div class="flex flex-1 gap-6">
        <!-- Left: Visualizer -->
        <div class="panel flex-1 flex flex-col items-center justify-center gap-8">
            <div class="flex gap-20">
                <div class="flex flex-col gap-2">
                    <span class="text-[9px] text-center">SIDE L (M1/M2)</span>
                    <div class="motor-indicator w-32"><div id="bar-l" class="motor-fill"></div></div>
                </div>
                <div class="flex flex-col gap-2">
                    <span class="text-[9px] text-center">SIDE R (M3/M4)</span>
                    <div class="motor-indicator w-32"><div id="bar-r" class="motor-fill"></div></div>
                </div>
            </div>

            <div class="joystick-view">
                <div id="visual-stick" class="stick"></div>
            </div>

            <div class="text-[11px] text-gray-400">
                MODE: <span id="input-mode" class="text-white">IDLE</span> | 
                PWR: <span id="pwr-display" class="text-white">0%</span>
            </div>
        </div>

        <!-- Right: Keyboard Layout -->
        <div class="panel w-64 flex flex-col gap-4">
            <h2 class="text-xs border-b border-gray-800 pb-2 text-gray-400 uppercase">Input Stack</h2>
            <div class="grid grid-cols-3 gap-2">
                <div></div><div id="key-w" class="p-4 bg-gray-900 rounded text-center font-bold">W</div><div></div>
                <div id="key-a" class="p-4 bg-gray-900 rounded text-center font-bold">A</div>
                <div id="key-s" class="p-4 bg-gray-900 rounded text-center font-bold">S</div>
                <div id="key-d" class="p-4 bg-gray-900 rounded text-center font-bold">D</div>
            </div>
            <div class="mt-auto bg-black p-3 rounded text-[10px] text-green-700">
                [SYSTEM LOG]<br>
                <div id="log-content">READY FOR LINK...</div>
            </div>
        </div>
    </div>

    <script>
        const ipInput = document.getElementById('ip-input');
        const visualStick = document.getElementById('visual-stick');
        const logContent = document.getElementById('log-content');
        
        if(localStorage.getItem('last_ip')) ipInput.value = localStorage.getItem('last_ip');

        let bridgeActive = false;
        let lastPacket = "";
        
        // Settings
        const DEADZONE = 0.08;
        const MIN_PWM = 110;
        const MAX_PWM = 255;

        // Input State
        let keyboardStack = [];
        let gamepadIndex = null;

        function log(msg) {
            logContent.innerHTML = msg + "<br>" + logContent.innerHTML.split("<br>").slice(0, 3).join("<br>");
        }

        async function pingBridge() {
            const ip = ipInput.value.trim();
            if(!ip) return;
            localStorage.setItem('last_ip', ip);
            try {
                await fetch(`http://${ip}:5000/`, { mode: 'no-cors' });
                bridgeActive = true;
                document.getElementById('connection-status').className = "w-3 h-3 rounded-full bg-green-500 shadow-[0_0_10px_#0f0]";
                log("BRIDGE LINKED");
            } catch (e) { log("LINK FAILED"); }
        }
        setInterval(pingBridge, 3000);

        window.addEventListener("gamepadconnected", (e) => {
            gamepadIndex = e.gamepad.index;
            log("XBOX CTRL CONNECTED");
        });

        // Controller Mixing Logic
        function calculateMotors(y, x) {
            // y: -1 to 1 (forward/backward)
            // x: -1 to 1 (left/right)
            
            // Differential Drive mixing
            let left = y + x;
            let right = y - x;

            // Constrain
            left = Math.max(-1, Math.min(1, left));
            right = Math.max(-1, Math.min(1, right));

            // Map to PWM
            const process = (val) => {
                const absVal = Math.abs(val);
                if (absVal < 0.01) return 0;
                // Map 0.01-1.0 to MIN_PWM-MAX_PWM
                let pwm = MIN_PWM + (absVal * (MAX_PWM - MIN_PWM));
                return Math.round(pwm * (val > 0 ? 1 : -1));
            };

            return { L: process(left), R: process(right), rawX: x, rawY: y };
        }

        function update() {
            let motorData = { L: 0, R: 0, rawX: 0, rawY: 0 };
            let mode = "IDLE";

            // 1. Check Gamepad First (Priority)
            const gp = gamepadIndex !== null ? navigator.getGamepads()[gamepadIndex] : null;
            if (gp && (Math.abs(gp.axes[0]) > DEADZONE || Math.abs(gp.axes[1]) > DEADZONE)) {
                // Invert Y because Up is -1 on Gamepads
                motorData = calculateMotors(-gp.axes[1], gp.axes[0]);
                mode = "XBOX";
            } 
            // 2. Fallback to Keyboard Stack
            else if (keyboardStack.length > 0) {
                const key = keyboardStack[keyboardStack.length - 1];
                if (key === 'w') motorData = calculateMotors(1, 0);
                if (key === 's') motorData = calculateMotors(-1, 0);
                if (key === 'a') motorData = calculateMotors(0, -1);
                if (key === 'd') motorData = calculateMotors(0, 1);
                mode = "KEYS";
            }

            transmit(motorData, mode);
            requestAnimationFrame(update);
        }

        async function transmit(data, mode) {
            const packet = `L:${data.L},R:${data.R}`;
            
            // Update UI
            document.getElementById('input-mode').innerText = mode;
            document.getElementById('bar-l').style.width = (Math.abs(data.L)/255*100) + "%";
            document.getElementById('bar-r').style.width = (Math.abs(data.R)/255*100) + "%";
            visualStick.style.left = (50 + (data.rawX * 40)) + "%";
            visualStick.style.top = (50 - (data.rawY * 40)) + "%";
            document.getElementById('pwr-display').innerText = Math.round(Math.max(Math.abs(data.L), Math.abs(data.R)) / 255 * 100) + "%";

            if (packet === lastPacket || !bridgeActive) return;
            lastPacket = packet;

            const ip = ipInput.value.trim();
            try {
                fetch(`http://${ip}:5000/control`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'text/plain' },
                    body: JSON.stringify({ throttle: packet })
                });
            } catch (e) {}
        }

        // Keyboard Logic
        window.addEventListener('keydown', (e) => {
            const key = e.key.toLowerCase();
            if (['w','a','s','d'].includes(key) && !keyboardStack.includes(key)) {
                keyboardStack.push(key);
                document.getElementById('key-'+key).classList.add('active-key');
            }
        });
        window.addEventListener('keyup', (e) => {
            const key = e.key.toLowerCase();
            keyboardStack = keyboardStack.filter(k => k !== key);
            if(document.getElementById('key-'+key)) document.getElementById('key-'+key).classList.remove('active-key');
        });

        update();
    </script>
</body>
</html>
