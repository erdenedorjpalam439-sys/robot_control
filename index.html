<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>RC Max Power Controller</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body {
            background-color: #0f0f0f;
            color: #fff;
            font-family: 'Segoe UI', system-ui, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            overflow: hidden;
            touch-action: none;
        }

        .controller-panel {
            display: flex;
            flex-direction: column;
            gap: 20px;
            align-items: center;
            width: 100%;
            max-width: 400px;
            padding: 20px;
        }

        .drive-btn {
            width: 100%;
            height: 180px;
            border-radius: 20px;
            font-size: 24px;
            font-weight: bold;
            text-transform: uppercase;
            letter-spacing: 2px;
            border: 4px solid #333;
            background: linear-gradient(145deg, #222, #111);
            transition: all 0.1s;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            user-select: none;
            -webkit-user-select: none;
        }

        .drive-btn:active {
            transform: scale(0.95);
            border-color: #00ff41;
            box-shadow: 0 0 30px rgba(0, 255, 65, 0.3);
            background: #002200;
        }

        .drive-btn.reverse:active {
            border-color: #ff3333;
            box-shadow: 0 0 30px rgba(255, 51, 51, 0.3);
            background: #220000;
        }

        .lcd {
            width: 100%;
            background: #051005;
            border: 3px solid #222;
            border-radius: 10px;
            padding: 15px;
            font-family: 'Courier New', monospace;
            color: #0f0;
            margin-bottom: 10px;
            text-shadow: 0 0 5px rgba(0, 255, 0, 0.5);
        }

        .status-dot {
            height: 10px;
            width: 10px;
            background-color: #333;
            border-radius: 50%;
            display: inline-block;
            margin-right: 8px;
        }

        .status-online { background-color: #0f0; box-shadow: 0 0 10px #0f0; }
    </style>
</head>
<body>

    <div class="controller-panel">
        <div class="lcd">
            <div class="flex justify-between text-[10px] opacity-60 mb-2">
                <span>TX MODE: BINARY</span>
                <span>MAX: 255</span>
            </div>
            <div id="telemetry">
                BRIDGE: DISCONNECTED<br>
                THR: 0 (IDLE)
            </div>
        </div>

        <!-- Forward Button -->
        <button 
            class="drive-btn" 
            id="fwd-btn"
            ontouchstart="sendCommand(255)" 
            ontouchend="sendCommand(0)"
            onmousedown="sendCommand(255)"
            onmouseup="sendCommand(0)">
            <svg viewBox="0 0 24 24" width="48" height="48" fill="currentColor" class="mb-2"><path d="M7,14L12,9L17,14H7Z" /></svg>
            Forward
        </button>

        <!-- Backward Button -->
        <button 
            class="drive-btn reverse" 
            id="back-btn"
            ontouchstart="sendCommand(-255)" 
            ontouchend="sendCommand(0)"
            onmousedown="sendCommand(-255)"
            onmouseup="sendCommand(0)">
            <svg viewBox="0 0 24 24" width="48" height="48" fill="currentColor" class="mb-2"><path d="M7,10L12,15L17,10H7Z" /></svg>
            Reverse
        </button>
    </div>

    <script>
        // --- CONFIGURATION ---
        // REPLACE THIS WITH YOUR LAPTOP'S IPv4 ADDRESS
        const LAPTOP_IP = "172.20.10.9"; 
        const API_URL = `http://${LAPTOP_IP}:5000/control`;

        const telemetry = document.getElementById('telemetry');
        let lastValue = null;

        async function sendCommand(value) {
            // Avoid sending the same command multiple times
            if (value === lastValue) return;
            lastValue = value;

            try {
                const response = await fetch(API_URL, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        throttle: value,
                        steering: 0 // No steering for this layout
                    })
                });

                if (response.ok) {
                    updateUI("CONNECTED", value);
                } else {
                    updateUI("BRIDGE ERROR", value);
                }
            } catch (error) {
                updateUI("NO BRIDGE", value);
            }
        }

        function updateUI(status, value) {
            let label = value === 255 ? "FORWARD" : value === -255 ? "REVERSE" : "IDLE";
            telemetry.innerHTML = `
                BRIDGE: ${status}<br>
                THR: ${value} (${label})
            `;
        }
    </script>
</body>
</html>
