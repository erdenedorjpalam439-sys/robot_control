<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>RC Pro - Multi-Speed</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body { 
            background: #0f0f0f; 
            color: #fff; 
            font-family: monospace; 
            touch-action: none; 
            overflow: hidden;
            -webkit-user-select: none;
            user-select: none;
        }
        
        .drive-btn {
            width: 100%;
            height: 180px;
            background: #1a1a1a;
            border: 4px solid #333;
            border-radius: 20px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            transition: all 0.1s;
            position: relative;
        }

        .drive-btn:active, .drive-btn.active {
            transform: scale(0.96);
            border-color: #0f0;
            background: #052205;
        }

        .drive-btn.rev:active, .drive-btn.rev.active {
            border-color: #f00;
            background: #220505;
        }

        .speed-indicator {
            font-size: 10px;
            color: #666;
            margin-top: 8px;
        }

        .lcd {
            background: #051005; border: 2px solid #1a1a1a; border-radius: 8px;
            padding: 8px; color: #0f0; font-size: 10px; height: 100px; 
            overflow-y: auto; width: 100%;
        }
        
        .ip-bar {
            background: #1a1a1a;
            padding: 12px;
            border-radius: 12px;
            border: 1px solid #333;
        }

        .status-pill {
            font-size: 9px;
            padding: 4px 8px;
            border-radius: 20px;
            background: #333;
            font-weight: bold;
        }
        .online { background: #060; color: #fff; box-shadow: 0 0 10px #0f0; }
    </style>
</head>
<body class="p-4 flex flex-col items-center gap-4">

    <!-- Config Bar -->
    <div class="ip-bar w-full flex flex-col gap-3">
        <div class="flex justify-between items-center">
            <span class="text-[10px] text-gray-400 font-bold">BRIDGE IP:</span>
            <input id="ip-input" type="text" inputmode="decimal" class="bg-black border border-green-900 px-3 py-2 text-white text-sm w-40 rounded" placeholder="192.168.x.x">
        </div>
        <div class="flex gap-2">
            <button onclick="pingBridge()" class="bg-blue-700 text-[11px] font-bold py-2 px-3 rounded flex-1 active:bg-blue-500">SYNC CONNECTION</button>
            <div id="status-pill" class="status-pill flex items-center">OFFLINE</div>
        </div>
    </div>

    <!-- Controls -->
    <div class="w-full flex flex-col gap-4 flex-1 justify-center">
        <!-- Forward Button -->
        <div id="btn-fwd" class="drive-btn">
            <span class="text-3xl font-black">W</span>
            <span class="text-xs font-bold text-gray-400 uppercase">Forward</span>
            <span class="speed-indicator">Hold: 150 | Double-Hold: 255</span>
        </div>

        <!-- Reverse Button -->
        <div id="btn-rev" class="drive-btn rev">
            <span class="text-3xl font-black">S</span>
            <span class="text-xs font-bold text-gray-400 uppercase">Reverse</span>
            <span class="speed-indicator">Hold: 150 | Double-Hold: 255</span>
        </div>
    </div>

    <!-- Logs -->
    <div class="lcd" id="log-window">
        <div id="log-content">
            <div>[ INPUTS ENABLED: TOUCH + KEYBOARD ]</div>
            <div>- Single W/S: Half Speed (150)</div>
            <div>- Double W/S: Full Speed (255)</div>
        </div>
    </div>

    <script>
        const logContent = document.getElementById('log-content');
        const logWindow = document.getElementById('log-window');
        const statusPill = document.getElementById('status-pill');
        const ipInput = document.getElementById('ip-input');
        
        if(localStorage.getItem('last_ip')) ipInput.value = localStorage.getItem('last_ip');

        let throttleValue = 0;
        let lastSentValue = null;
        let isActive = false;

        // Gesture Variables
        let lastTapTimes = { 'btn-fwd': 0, 'btn-rev': 0 };
        const DOUBLE_TAP_DELAY = 300; // ms
        
        // Key Tracking
        const keysPressed = {};

        function log(msg, type = "INFO") {
            const div = document.createElement('div');
            div.innerHTML = `<span class="opacity-50">${new Date().toLocaleTimeString().split(' ')[0]}</span> [${type}] ${msg}`;
            logContent.appendChild(div);
            if (logContent.children.length > 10) logContent.removeChild(logContent.firstChild);
            logWindow.scrollTop = logWindow.scrollHeight;
        }

        async function pingBridge() {
            const ip = ipInput.value.trim();
            if(!ip) return;
            localStorage.setItem('last_ip', ip);
            try {
                await fetch(`http://${ip}:5000/`, { mode: 'no-cors' });
                isActive = true;
                statusPill.innerText = "ONLINE";
                statusPill.className = "status-pill online";
                log("Connected to Bridge");
            } catch (e) {
                log("Bridge Not Found", "ERR");
            }
        }

        async function transmit() {
            if (!isActive || throttleValue === lastSentValue) return;
            const ip = ipInput.value.trim();
            lastSentValue = throttleValue;
            try {
                await fetch(`http://${ip}:5000/control`, {
                    method: 'POST',
                    mode: 'cors',
                    headers: { 'Content-Type': 'text/plain' },
                    body: JSON.stringify({ throttle: throttleValue, steering: 0 })
                });
            } catch (e) {}
        }

        setInterval(transmit, 50);

        function handleCommandStart(id, direction) {
            const now = Date.now();
            const isDouble = (now - lastTapTimes[id]) < DOUBLE_TAP_DELAY;
            lastTapTimes[id] = now;

            const speed = isDouble ? 255 : 150;
            throttleValue = speed * direction;
            
            document.getElementById(id).classList.add('active');
            log(`${isDouble ? "Turbo" : "Normal"} ${direction > 0 ? "Forward" : "Reverse"}`);
        }

        function handleCommandEnd(id) {
            throttleValue = 0;
            document.getElementById(id).classList.remove('active');
        }

        // Setup Touch/Mouse Events
        function setupButton(id, direction) {
            const btn = document.getElementById(id);
            btn.addEventListener('touchstart', (e) => { e.preventDefault(); handleCommandStart(id, direction); }, {passive: false});
            btn.addEventListener('touchend', (e) => { e.preventDefault(); handleCommandEnd(id); }, {passive: false});
            btn.addEventListener('mousedown', () => handleCommandStart(id, direction));
            btn.addEventListener('mouseup', () => handleCommandEnd(id));
        }

        setupButton('btn-fwd', 1);
        setupButton('btn-rev', -1);

        // Keyboard Support
        window.addEventListener('keydown', (e) => {
            const key = e.key.toLowerCase();
            if (keysPressed[key]) return; // Prevent repeat fire
            
            if (key === 'w') {
                keysPressed[key] = true;
                handleCommandStart('btn-fwd', 1);
            } else if (key === 's') {
                keysPressed[key] = true;
                handleCommandStart('btn-rev', -1);
            }
        });

        window.addEventListener('keyup', (e) => {
            const key = e.key.toLowerCase();
            keysPressed[key] = false;
            
            if (key === 'w') {
                handleCommandEnd('btn-fwd');
            } else if (key === 's') {
                handleCommandEnd('btn-rev');
            }
        });
    </script>
</body>
</html>
