<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>RC Pro - Final Fix</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body { background: #0a0a0a; color: #fff; font-family: monospace; touch-action: none; overflow: hidden; }
        .well { background: #000; border: 2px solid #333; position: relative; display: flex; justify-content: center; align-items: center; border-radius: 40px; }
        .well-v { width: 80px; height: 300px; }
        .handle { width: 76px; height: 76px; background: #444; border-radius: 50%; border: 2px solid #666; position: absolute; box-shadow: 0 5px 15px #000; }
        .lcd { background: #051005; border: 1px solid #1a1a1a; padding: 10px; color: #0f0; font-size: 11px; height: 120px; overflow-y: auto; border-radius: 5px; }
    </style>
</head>
<body class="p-4 flex flex-col gap-4">

    <div class="bg-zinc-900 p-3 rounded-lg border border-zinc-800 flex flex-col gap-2">
        <div class="flex justify-between items-center">
            <span class="text-[10px] text-zinc-500">BRIDGE IP:</span>
            <input id="ip-input" type="text" class="bg-black border border-zinc-700 px-2 py-1 text-white text-xs w-40" value="192.168.137.1">
        </div>
        <button onclick="pingBridge()" class="bg-blue-600 text-[11px] font-bold py-2 rounded">TEST CONNECTION</button>
    </div>

    <div class="flex-1 flex justify-center items-center">
        <div class="well well-v" id="th-well">
            <div class="handle" id="th-handle"></div>
        </div>
    </div>

    <div class="lcd" id="log-window">
        <div id="log-content">
            <div>[ READY ]</div>
            <div>1. Set Hotspot to 2.4GHz</div>
            <div>2. Check Windows Firewall</div>
        </div>
    </div>

    <script>
        const logContent = document.getElementById('log-content');
        const thHandle = document.getElementById('th-handle');
        const thWell = document.getElementById('th-well');
        
        let throttleValue = 0;
        let isActive = false;

        function log(msg) {
            const div = document.createElement('div');
            div.innerText = `> ${msg}`;
            logContent.appendChild(div);
            document.getElementById('log-window').scrollTop = 9999;
        }

        async function pingBridge() {
            const ip = document.getElementById('ip-input').value;
            log(`Checking ${ip}:5000...`);
            try {
                const controller = new AbortController();
                setTimeout(() => controller.abort(), 2000);
                await fetch(`http://${ip}:5000/`, { mode: 'no-cors', signal: controller.signal });
                log("CONNECTED!");
                isActive = true;
            } catch (e) {
                log("FAILED: Check Firewall/Hotspot");
                isActive = false;
            }
        }

        setInterval(async () => {
            if (!isActive) return;
            const ip = document.getElementById('ip-input').value;
            try {
                await fetch(`http://${ip}:5000/control`, {
                    method: 'POST',
                    body: JSON.stringify({ throttle: throttleValue, steering: 0 }),
                    headers: { 'Content-Type': 'text/plain' }
                });
            } catch (e) {}
        }, 100);

        function init() {
            let dragging = false;
            const move = (e) => {
                if (!dragging) return;
                const touch = e.touches ? e.touches[0] : e;
                const rect = thWell.getBoundingClientRect();
                const limit = rect.height / 2 - 40;
                let pos = touch.clientY - (rect.top + rect.height / 2);
                pos = Math.max(-limit, Math.min(limit, pos));
                thHandle.style.transform = `translateY(${pos}px)`;
                throttleValue = Math.round((pos / limit) * -255);
            };
            thHandle.addEventListener('touchstart', () => dragging = true);
            window.addEventListener('touchmove', move, { passive: false });
            window.addEventListener('touchend', () => {
                dragging = false;
                thHandle.style.transform = "translateY(0)";
                throttleValue = 0;
            });
        }
        init();
    </script>
</body>
</html>
