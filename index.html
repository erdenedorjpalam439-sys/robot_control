<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>RC Pro - Differential Drive</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body { background: #050505; color: #0f0; font-family: 'Courier New', monospace; touch-action: none; overflow: hidden; }
        .panel { background: #0c0c0c; border: 1px solid #1a3a1a; border-radius: 12px; padding: 15px; }
        .joystick-view { 
            width: 200px; height: 200px; border: 2px solid #111; border-radius: 50%; 
            position: relative; background: radial-gradient(circle, #0a1a0a 0%, #000 100%); 
        }
        .stick { 
            width: 60px; height: 60px; background: #0f0; border-radius: 50%; 
            position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); 
            box-shadow: 0 0 20px #0f0; transition: transform 0.05s;
        }
        .active-key { background: #0f0 !important; color: #000 !important; box-shadow: 0 0 10px #0f0; }
    </style>
</head>
<body class="p-6 flex flex-col gap-6 h-screen">

    <div class="panel flex justify-between items-center">
        <div>
            <h1 class="text-xl font-bold tracking-tighter text-white uppercase italic">Nexus Differential <span class="text-xs text-green-800">V2.0-REV</span></h1>
            <p class="text-[10px] text-green-500 uppercase">Vector Logic Enabled</p>
        </div>
        <div class="flex gap-4 items-center">
            <input id="ip-input" type="text" placeholder="Bridge IP" class="bg-black border border-green-900 px-3 py-1 rounded text-sm text-center text-green-500 outline-none w-40">
            <div id="connection-status" class="w-3 h-3 rounded-full bg-red-600"></div>
        </div>
    </div>

    <div class="flex flex-1 gap-6 flex-col md:flex-row">
        <div class="panel flex-1 flex flex-col items-center justify-center gap-8">
            <div id="joy-area" class="joystick-view">
                <div id="visual-stick" class="stick"></div>
            </div>
            <div class="flex gap-10 text-center">
                <div><p class="text-[10px] text-gray-500">LEFT</p><span id="val-l" class="text-2xl font-bold">0</span></div>
                <div><p class="text-[10px] text-gray-500">RIGHT</p><span id="val-r" class="text-2xl font-bold">0</span></div>
            </div>
        </div>

        <div class="panel w-full md:w-64 flex flex-col gap-4">
            <h2 class="text-xs text-gray-400 uppercase">Manual Override</h2>
            <div class="grid grid-cols-3 gap-2">
                <div></div><div id="key-w" class="p-4 bg-gray-900 rounded text-center">W</div><div></div>
                <div id="key-a" class="p-4 bg-gray-900 rounded text-center">A</div>
                <div id="key-s" class="p-4 bg-gray-900 rounded text-center">S</div>
                <div id="key-d" class="p-4 bg-gray-900 rounded text-center">D</div>
            </div>
            <div class="mt-auto text-[9px] text-green-900 uppercase">
                Status: <span id="input-mode" class="text-white">Idle</span>
            </div>
        </div>
    </div>

    <script>
        const ipInput = document.getElementById('ip-input');
        const stick = document.getElementById('visual-stick');
        const joyArea = document.getElementById('joy-area');
        
        if(localStorage.getItem('last_ip')) ipInput.value = localStorage.getItem('last_ip');

        let lastPacket = "";
        let bridgeActive = false;
        let touchActive = false;
        let keyboardStack = [];
        let moveData = { x: 0, y: 0 };

        async function ping() {
            const ip = ipInput.value.trim();
            if(!ip) return;
            localStorage.setItem('last_ip', ip);
            try {
                await fetch(`http://${ip}:5000/`, { mode: 'no-cors' });
                bridgeActive = true;
                document.getElementById('connection-status').className = 'w-3 h-3 rounded-full bg-green-500';
            } catch (e) { 
                bridgeActive = false; 
                document.getElementById('connection-status').className = 'w-3 h-3 rounded-full bg-red-600';
            }
        }
        setInterval(ping, 3000);

        function handleJoystick(e) {
            e.preventDefault();
            const rect = joyArea.getBoundingClientRect();
            const t = e.touches ? e.touches[0] : e;
            let x = (t.clientX - (rect.left + rect.width/2)) / (rect.width/2);
            let y = ((rect.top + rect.height/2) - t.clientY) / (rect.height/2);
            moveData.x = Math.max(-1, Math.min(1, x));
            moveData.y = Math.max(-1, Math.min(1, y));
        }

        joyArea.addEventListener('touchstart', (e) => { touchActive = true; handleJoystick(e); });
        window.addEventListener('touchmove', (e) => { if(touchActive) handleJoystick(e); });
        window.addEventListener('touchend', () => { touchActive = false; moveData = {x:0, y:0}; });

        function update() {
            let mode = "IDLE";
            let finalX = moveData.x;
            let finalY = moveData.y;

            if (keyboardStack.length > 0) {
                const k = keyboardStack[keyboardStack.length-1];
                mode = "KEYS";
                if(k === 'w') { finalY = 1; finalX = 0; }
                if(k === 's') { finalY = -1; finalX = 0; }
                if(k === 'a') { finalY = 0; finalX = -1; }
                if(k === 'd') { finalY = 0; finalX = 1; }
            } else if (touchActive) {
                mode = "TOUCH";
            }

            // Mixing logic: Differential Steering
            let left = finalY + finalX;
            let right = finalY - finalX;
            
            // Normalize
            let max = Math.max(Math.abs(left), Math.abs(right), 1);
            left /= max; right /= max;

            const scale = (v) => {
                if(Math.abs(v) < 0.1) return 0;
                return Math.round(v * 255);
            };

            const data = { L: scale(left), R: scale(right), rawX: finalX, rawY: finalY };
            
            // UI
            document.getElementById('val-l').innerText = data.L;
            document.getElementById('val-r').innerText = data.R;
            document.getElementById('input-mode').innerText = mode;
            stick.style.transform = `translate(calc(-50% + ${data.rawX * 70}px), calc(-50% - ${data.rawY * 70}px))`;

            transmit(data.L, data.R);
            requestAnimationFrame(update);
        }

        function transmit(l, r) {
            const packet = `L:${l},R:${r}`;
            if (packet === lastPacket || !bridgeActive) return;
            lastPacket = packet;

            fetch(`http://${ipInput.value.trim()}:5000/control`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ throttle: packet })
            }).catch(()=>{});
        }

        window.addEventListener('keydown', (e) => {
            const key = e.key.toLowerCase();
            if(['w','a','s','d'].includes(key) && !keyboardStack.includes(key)) {
                keyboardStack.push(key);
                document.getElementById('key-'+key).classList.add('active-key');
            }
        });
        window.addEventListener('keyup', (e) => {
            const key = e.key.toLowerCase();
            keyboardStack = keyboardStack.filter(k => k !== key);
            if(document.getElementById('key-'+key)) document.getElementById('key-'+key).classList.remove('active-key');
        });

        update();
    </script>
</body>
</html>
