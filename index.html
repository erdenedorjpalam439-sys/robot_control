<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>RC Pro - Ultra Fix</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body { 
            background: #0f0f0f; 
            color: #fff; 
            font-family: monospace; 
            touch-action: none; 
            overflow: hidden;
            -webkit-user-select: none;
            user-select: none;
        }
        
        .well {
            background: #050505;
            border: 3px solid #333;
            box-shadow: inset 0 0 20px #000;
            position: relative;
            display: flex;
            justify-content: center;
            align-items: center;
            border-radius: 50px;
        }
        .well-v { width: 90px; height: 320px; }
        
        .handle {
            width: 84px;
            height: 84px;
            background: radial-gradient(circle at 30% 30%, #777, #111);
            border: 2px solid #555;
            border-radius: 50%;
            z-index: 10;
            box-shadow: 0 8px 20px rgba(0,0,0,0.9);
            position: absolute;
            will-change: transform;
        }

        .lcd {
            background: #051005; border: 2px solid #1a1a1a; border-radius: 8px;
            padding: 8px; color: #0f0; font-size: 10px; height: 110px; 
            overflow-y: auto; width: 100%;
        }
        
        .ip-bar {
            background: #1a1a1a;
            padding: 12px;
            border-radius: 12px;
            border: 1px solid #333;
        }

        .status-pill {
            font-size: 9px;
            padding: 4px 8px;
            border-radius: 20px;
            background: #333;
            font-weight: bold;
        }
        .online { background: #060; color: #fff; box-shadow: 0 0 10px #0f0; }
    </style>
</head>
<body class="p-4 flex flex-col items-center gap-4">

    <!-- Mobile Config -->
    <div class="ip-bar w-full flex flex-col gap-3">
        <div class="flex justify-between items-center">
            <span class="text-[10px] text-gray-400 font-bold">BRIDGE IP:</span>
            <input id="ip-input" 
                   type="text" 
                   inputmode="decimal"
                   class="bg-black border border-green-900 px-3 py-2 text-white text-sm w-40 rounded" 
                   placeholder="e.g. 192.168.137.1">
        </div>
        <div class="flex gap-2">
            <button onclick="pingBridge()" class="bg-blue-700 text-[11px] font-bold py-2 px-3 rounded flex-1 active:bg-blue-500">
                1. CHECK CONNECTION
            </button>
            <div id="status-pill" class="status-pill flex items-center">OFFLINE</div>
        </div>
    </div>

    <!-- Lever -->
    <div class="flex flex-col items-center gap-2 flex-1 justify-center">
        <div class="well well-v" id="th-well">
            <div class="handle" id="th-handle"></div>
        </div>
        <span class="text-[11px] text-gray-500 font-bold uppercase tracking-[0.2em]">Throttle</span>
    </div>

    <!-- Logs -->
    <div class="lcd" id="log-window">
        <div id="log-content">
            <div>[ VERSION 2.1: EMERGENCY FIX ]</div>
            <div>- Ensure Python is running</div>
            <div>- Ensure Phone is on Laptop Hotspot</div>
        </div>
    </div>

    <script>
        const logContent = document.getElementById('log-content');
        const logWindow = document.getElementById('log-window');
        const thHandle = document.getElementById('th-handle');
        const thWell = document.getElementById('th-well');
        const statusPill = document.getElementById('status-pill');
        const ipInput = document.getElementById('ip-input');
        
        if(localStorage.getItem('last_ip')) ipInput.value = localStorage.getItem('last_ip');

        let throttleValue = 0;
        let lastSentValue = null;
        let isActive = false;

        function log(msg, type = "INFO") {
            const div = document.createElement('div');
            div.innerHTML = `<span class="opacity-50">${new Date().toLocaleTimeString().split(' ')[0]}</span> [${type}] ${msg}`;
            logContent.appendChild(div);
            if (logContent.children.length > 15) logContent.removeChild(logContent.firstChild);
            logWindow.scrollTop = logWindow.scrollHeight;
        }

        // Method 5: Image-based ping (Bypasses most browser CORS blocks)
        async function pingBridge() {
            const ip = ipInput.value.trim();
            if(!ip) return log("Enter IP first", "ERR");
            localStorage.setItem('last_ip', ip);
            
            log(`Probing http://${ip}:5000...`);
            
            // Try regular fetch first
            try {
                const res = await fetch(`http://${ip}:5000/`, { 
                    mode: 'no-cors',
                    cache: 'no-cache'
                });
                setConnected(true);
                log("Connection Verified!", "NET");
            } catch (e) {
                // If fetch fails, try image-based probe
                const img = new Image();
                img.onload = () => { setConnected(true); log("Ping via Image Success", "NET"); };
                img.onerror = () => { setConnected(false); log("All connection methods failed", "ERR"); };
                img.src = `http://${ip}:5000/favicon.ico?${Date.now()}`;
            }
        }

        function setConnected(state) {
            isActive = state;
            statusPill.innerText = state ? "ONLINE" : "OFFLINE";
            statusPill.className = "status-pill " + (state ? "online" : "");
        }

        async function transmit() {
            if (!isActive) return;
            if (throttleValue === lastSentValue && throttleValue !== 0) return;
            
            const ip = ipInput.value.trim();
            const currentVal = throttleValue;
            lastSentValue = currentVal;

            try {
                // Using 'navigator.sendBeacon' or 'text/plain' to avoid preflight
                await fetch(`http://${ip}:5000/control`, {
                    method: 'POST',
                    mode: 'cors',
                    headers: { 'Content-Type': 'text/plain' }, // Changed to text/plain to avoid CORS preflight
                    body: JSON.stringify({ throttle: currentVal, steering: 0 }),
                    keepalive: true
                });
            } catch (e) {
                // Connection lost
                if (currentVal !== 0) setConnected(false);
            }
        }

        setInterval(transmit, 50);

        function initLever() {
            let dragging = false;
            let rect = null;

            const onMove = (e) => {
                if (!dragging) return;
                const touch = e.touches ? e.touches[0] : e;
                if (!rect) rect = thWell.getBoundingClientRect();
                
                const limit = rect.height / 2 - 42;
                let pos = touch.clientY - (rect.top + rect.height / 2);
                pos = Math.max(-limit, Math.min(limit, pos));
                
                thHandle.style.transform = `translateY(${pos}px)`;
                
                let raw = Math.round((pos / limit) * -255);
                if (Math.abs(raw) < 30) throttleValue = 0;
                else throttleValue = raw;
            };

            const onEnd = () => {
                dragging = false;
                rect = null;
                thHandle.style.transition = "transform 0.2s ease-out";
                thHandle.style.transform = "translateY(0)";
                throttleValue = 0;
                setTimeout(() => thHandle.style.transition = "", 200);
            };

            thHandle.addEventListener('touchstart', (e) => { 
                e.preventDefault(); 
                rect = thWell.getBoundingClientRect(); 
                dragging = true; 
            }, {passive: false});
            
            window.addEventListener('touchmove', onMove, { passive: false });
            window.addEventListener('touchend', onEnd);
            thHandle.addEventListener('mousedown', (e) => { dragging = true; rect = thWell.getBoundingClientRect(); });
            window.addEventListener('mousemove', onMove);
            window.addEventListener('mouseup', onEnd);
        }

        initLever();
    </script>
</body>
</html>
