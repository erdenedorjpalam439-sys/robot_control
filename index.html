<!DOCTYPE html>
<html lang="mn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Nexus Vector Controller</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body { 
            background: #050505; 
            color: #00ff41; 
            font-family: 'monospace'; 
            touch-action: none; 
            overflow: hidden; 
            user-select: none;
            margin: 0;
            display: flex;
            flex-direction: column;
            height: 100vh;
        }
        .panel { background: rgba(15, 15, 15, 0.9); border: 1px solid #1a3a1a; border-radius: 8px; }
        .joystick-view { 
            width: 240px; height: 240px; border: 2px solid #1a3a1a; border-radius: 50%; 
            position: relative; background: radial-gradient(circle, #0a1a0a 0%, #000 100%); 
            box-shadow: 0 0 20px rgba(0,255,0,0.05); touch-action: none;
        }
        .stick { 
            width: 70px; height: 70px; 
            background: linear-gradient(145deg, #00ff00, #008800); 
            border-radius: 50%; position: absolute; top: 50%; left: 50%; 
            transform: translate(-50%, -50%); box-shadow: 0 0 30px rgba(0,255,0,0.5); 
            z-index: 10; pointer-events: none;
        }
        .bar-bg { width: 100%; height: 10px; background: #111; border-radius: 5px; overflow: hidden; border: 1px solid #222; }
        .bar-fill { height: 100%; background: #00ff00; width: 0%; transition: width 0.1s; }
        .status-on { color: #00ff00; text-shadow: 0 0 10px #00ff00; }
        .status-off { color: #ff0000; text-shadow: 0 0 10px #ff0000; }
    </style>
</head>
<body class="p-4 gap-4">

    <!-- Header Diagnostic Bar -->
    <div class="panel p-3 flex justify-between items-center border-b-2 border-green-900">
        <div>
            <h1 class="text-lg font-bold tracking-widest italic">NEXUS_VECTOR_V4.0</h1>
            <div class="text-[10px] flex gap-3 uppercase">
                <span>LINK: <span id="link-status" class="status-off">DISCONNECTED</span></span>
                <span>LATENCY: <span id="ping">--</span>ms</span>
            </div>
        </div>
        <input id="ip-addr" type="text" placeholder="BRIDGE_IP" 
               class="bg-black border border-green-900 px-3 py-1 rounded text-sm text-green-400 text-center outline-none w-40 focus:ring-1 ring-green-500">
    </div>

    <div class="flex flex-1 gap-4 flex-col lg:flex-row overflow-hidden">
        <!-- Main Control Logic -->
        <div class="panel flex-[3] flex flex-col items-center justify-center p-6 relative">
            <div class="absolute top-4 left-4 text-[10px] text-green-800">VECTOR_MIXING_ENGINE: ENABLED</div>
            
            <div class="mb-8 text-center">
                <div id="dir-display" class="text-5xl font-black italic opacity-80">STBY</div>
            </div>

            <div class="joystick-view" id="joy-surface">
                <div id="joy-stick" class="stick"></div>
                <div class="absolute top-1/2 w-full h-[1px] bg-green-900 opacity-20"></div>
                <div class="absolute left-1/2 h-full w-[1px] bg-green-900 opacity-20"></div>
            </div>

            <div class="mt-10 flex gap-12 text-center">
                <div><p class="text-[10px] text-gray-500 mb-1">CH_LEFT</p><p id="val-l" class="text-3xl font-mono">0</p></div>
                <div><p class="text-[10px] text-gray-500 mb-1">CH_RIGHT</p><p id="val-r" class="text-3xl font-mono">0</p></div>
            </div>
        </div>

        <!-- System Telemetry -->
        <div class="panel flex-1 p-4 flex flex-col gap-6">
            <h2 class="text-xs font-bold border-b border-green-900 pb-2 mb-2">TELEMETRY</h2>
            
            <div class="space-y-4">
                <div>
                    <div class="flex justify-between text-[10px] mb-1"><span>MOTOR_GROUP_L</span><span id="p-l">0%</span></div>
                    <div class="bar-bg"><div id="f-l" class="bar-fill"></div></div>
                </div>
                <div>
                    <div class="flex justify-between text-[10px] mb-1"><span>MOTOR_GROUP_R</span><span id="p-r">0%</span></div>
                    <div class="bar-bg"><div id="f-r" class="bar-fill"></div></div>
                </div>
            </div>

            <div class="mt-auto p-3 bg-black rounded border border-green-900 text-[9px] text-green-700">
                <p>> BAUD_RATE: 115200</p>
                <p>> PACKET_TYPE: STR_JSON</p>
                <p>> DRIVE_MODE: DIFFERENTIAL</p>
            </div>
        </div>
    </div>

    <script>
        const state = { active: false, x: 0, y: 0, lastP: "" };
        const el = {
            stick: document.getElementById('joy-stick'),
            surface: document.getElementById('joy-surface'),
            ip: document.getElementById('ip-addr'),
            status: document.getElementById('link-status'),
            ping: document.getElementById('ping')
        };

        if(localStorage.getItem('robot_ip')) el.ip.value = localStorage.getItem('robot_ip');

        function mix(y, x) {
            let mag = Math.sqrt(x*x + y*y);
            if (mag < 0.15) return { l: 0, r: 0, x: 0, y: 0 };
            if (mag > 1) mag = 1;

            let l = y + x;
            let r = y - x;

            const maxIn = Math.max(Math.abs(l), Math.abs(r));
            if (maxIn > 1) { l /= maxIn; r /= maxIn; }

            const scale = (v) => Math.round((v * mag) * 255);
            return { l: scale(l), r: scale(r), x, y };
        }

        const handleMove = (e) => {
            if(!state.active) return;
            e.preventDefault();
            const r = el.surface.getBoundingClientRect();
            const t = e.touches ? e.touches[0] : e;
            state.x = (t.clientX - (r.left + r.width/2)) / (r.width/2);
            state.y = ((r.top + r.height/2) - t.clientY) / (r.height/2);
            state.x = Math.max(-1, Math.min(1, state.x));
            state.y = Math.max(-1, Math.min(1, state.y));
        };

        el.surface.addEventListener('touchstart', (e) => { state.active = true; handleMove(e); }, {passive: false});
        window.addEventListener('touchmove', handleMove, {passive: false});
        window.addEventListener('touchend', () => { state.active = false; state.x = 0; state.y = 0; });

        async function loop() {
            const data = mix(state.y, state.x);
            
            // UI Updates
            el.stick.style.transform = `translate(calc(-50% + ${data.x * 90}px), calc(-50% - ${data.y * 90}px))`;
            document.getElementById('val-l').innerText = data.l;
            document.getElementById('val-r').innerText = data.r;
            document.getElementById('f-l').style.width = Math.abs(data.l/2.55) + "%";
            document.getElementById('f-r').style.width = Math.abs(data.r/2.55) + "%";

            // Transmit
            const packet = `L:${data.l},R:${data.r}`;
            if (packet !== state.lastP) {
                const ip = el.ip.value.trim();
                if(ip) {
                    localStorage.setItem('robot_ip', ip);
                    const start = Date.now();
                    try {
                        await fetch(`http://${ip}:5000/control`, {
                            method: 'POST',
                            headers: {'Content-Type': 'application/json'},
                            body: JSON.stringify({ throttle: packet })
                        });
                        state.lastP = packet;
                        el.status.className = "status-on";
                        el.status.innerText = "CONNECTED";
                        el.ping.innerText = Date.now() - start;
                    } catch(e) {
                        el.status.className = "status-off";
                        el.status.innerText = "LOST";
                    }
                }
            }
            requestAnimationFrame(loop);
        }
        loop();
    </script>
</body>
</html>
