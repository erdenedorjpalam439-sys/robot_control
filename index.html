<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>RC Pro - Diagnostic Mode</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body { background: #0f0f0f; color: #fff; font-family: monospace; touch-action: none; overflow: hidden; }
        .drive-btn {
            width: 100%; height: 140px; border-radius: 15px; font-size: 20px; font-weight: bold;
            border: 4px solid #333; background: #1a1a1a; transition: 0.1s;
        }
        .drive-btn:active { background: #004400; border-color: #0f0; transform: scale(0.98); }
        .drive-btn.rev:active { background: #440000; border-color: #f00; }
        .lcd {
            background: #051005; border: 2px solid #222; border-radius: 8px;
            padding: 10px; color: #0f0; font-size: 11px; height: 180px; overflow-y: auto;
        }
        .diag-btn { background: #333; padding: 8px; border-radius: 5px; font-size: 10px; }
    </style>
</head>
<body class="p-4 flex flex-col gap-4">

    <!-- Diagnostic Screen -->
    <div class="lcd" id="log-window">
        <div>[ SYSTEM READY ]</div>
        <div>1. Connect to Laptop Hotspot</div>
        <div>2. Enter IP: <input id="ip-input" class="bg-black border border-green-900 px-1 text-white" value="192.168.1.XX"></div>
    </div>

    <!-- Quick Tests -->
    <div class="flex gap-2">
        <button onclick="pingBridge()" class="diag-btn flex-1 bg-blue-900">TEST NETWORK PING</button>
        <button onclick="clearLogs()" class="diag-btn bg-gray-700">CLEAR LOGS</button>
    </div>

    <!-- Controls -->
    <div class="flex flex-col gap-4 mt-2">
        <button class="drive-btn" 
                ontouchstart="send(255)" ontouchend="send(0)" 
                onmousedown="send(255)" onmouseup="send(0)">
            FORWARD (255)
        </button>

        <button class="drive-btn rev" 
                ontouchstart="send(-255)" ontouchend="send(0)" 
                onmousedown="send(-255)" onmouseup="send(0)">
            REVERSE (-255)
        </button>
    </div>

    <script>
        const logs = document.getElementById('log-window');
        let lastVal = null;

        function log(msg, type = "INFO") {
            const div = document.createElement('div');
            div.innerHTML = `<span class="opacity-50">[${new Date().toLocaleTimeString()}]</span> [${type}] ${msg}`;
            logs.appendChild(div);
            logs.scrollTop = logs.scrollHeight;
        }

        function clearLogs() { logs.innerHTML = "<div>[ LOGS CLEARED ]</div>"; }

        async function pingBridge() {
            const ip = document.getElementById('ip-input').value;
            log(`Pinging http://${ip}:5000/ ...`);
            try {
                const start = Date.now();
                await fetch(`http://${ip}:5000/`, { mode: 'no-cors' });
                log(`Success! Laptop found in ${Date.now() - start}ms`, "NET");
            } catch (e) {
                log(`Failed to find Laptop. Check IP and Firewall.`, "ERR");
            }
        }

        async function send(val) {
            if (val === lastVal) return;
            lastVal = val;
            const ip = document.getElementById('ip-input').value;
            
            try {
                const res = await fetch(`http://${ip}:5000/control`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ throttle: val, steering: 0 })
                });
                
                if(res.ok) {
                    log(`Sent: ${val}`, "OK");
                } else {
                    log(`Bridge responded with error ${res.status}`, "ERR");
                }
            } catch (e) {
                log(`Could not reach Bridge. Check Python terminal.`, "ERR");
            }
        }
    </script>
</body>
</html>
